<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title id="page-title">Product — PricePro</title>
<meta name="description" id="page-desc" content="Compare prices across Indian stores."/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#2563eb"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
.product-page-wrap{max-width:1100px;margin:80px auto 0;padding:32px 20px 60px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text3);margin-bottom:24px;flex-wrap:wrap}
.breadcrumb a{color:var(--accent)}
.breadcrumb-sep{color:var(--border2)}
.pp-top{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;margin-bottom:32px;align-items:start}
.pp-img{border-radius:16px;overflow:hidden;border:1.5px solid var(--border);aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--bg2)}
.pp-info h1{font-size:22px;font-weight:800;line-height:1.3;margin-bottom:8px}
.pp-rating{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);margin-bottom:14px}
.price-hero{font-size:38px;font-weight:800;color:var(--green);line-height:1}
.price-orig-tag{font-size:16px;color:var(--text3);text-decoration:line-through;margin-left:8px}
.save-tag{display:inline-block;background:var(--green-light);color:var(--green);font-size:13px;font-weight:700;padding:4px 12px;border-radius:6px;margin:8px 0 16px}
.action-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.spec-pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.spec-pill{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--text2)}
.spec-pill strong{color:var(--text)}
.live-tag{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px;margin-top:10px}
.live-dot{width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sec-card{background:var(--bg);border:1.5px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px}
.sec-card h2{font-size:18px;font-weight:700;margin-bottom:18px}
.price-table{width:100%;border-collapse:collapse}
.price-table th{text-align:left;padding:10px 14px;font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);background:var(--bg2)}
.price-table td{padding:12px 14px;font-size:14px;border-bottom:1px solid var(--border)}
.price-table tr:hover td{background:var(--bg2)}
.best-row td{background:var(--green-light)!important}
.store-price{font-size:18px;font-weight:800;color:var(--green)}
.visit-link{padding:7px 16px;background:var(--accent);color:#fff;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:background .18s}
.visit-link:hover{background:var(--accent-dark)}
.price-disclaimer{background:var(--orange-light);border:1px solid #fed7aa;border-radius:6px;padding:8px 12px;font-size:12px;color:var(--orange);margin-top:8px}
[data-theme="dark"] .price-disclaimer{background:rgba(251,146,60,.1);border-color:rgba(251,146,60,.3);color:#fb923c}
.chart-wrap{height:120px;display:flex;align-items:flex-end;gap:5px;border-left:2px solid var(--border);border-bottom:2px solid var(--border);padding:8px 8px 0;margin-bottom:8px}
.chart-bar-item{flex:1;border-radius:4px 4px 0 0;cursor:pointer;transition:all .2s;position:relative;min-width:20px}
.chart-bar-item:hover{opacity:.8}
.chart-bar-item::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:10px;padding:4px 8px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .18s}
.chart-bar-item:hover::after{opacity:1}
.chart-months{display:flex;gap:5px;font-size:10px;color:var(--text3)}
.chart-month{flex:1;text-align:center}
.specs-table{width:100%;border-collapse:collapse}
.specs-table tr:nth-child(even) td{background:var(--bg2)}
.specs-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border)}
.specs-table td:first-child{color:var(--text3);width:38%;font-weight:500}
.rev-item{border-bottom:1px solid var(--border);padding:14px 0}
.rev-item:last-child{border-bottom:none}
.rev-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.star-5{color:#16a34a}.star-4{color:#65a30d}.star-3{color:#ca8a04}.star-2{color:#ea580c}.star-1{color:#dc2626}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.related-card{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;transition:all .18s;display:block}
.related-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.related-img{height:130px;overflow:hidden}
.related-info{padding:12px}
.related-name{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:6px}
.related-price{font-size:16px;font-weight:800;color:var(--green)}
.related-disc{font-size:11px;color:var(--red);margin-left:6px;font-weight:600}
.share-row{display:flex;gap:10px;flex-wrap:wrap}
.share-btn-sm{display:flex;align-items:center;gap:6px;padding:8px 16px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .18s;text-decoration:none}
.share-btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.sticky-buy-bar{position:sticky;bottom:0;background:rgba(255,255,255,.97);border-top:1.5px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:100;backdrop-filter:blur(8px)}
[data-theme="dark"] .sticky-buy-bar{background:rgba(15,23,42,.97)}
.sticky-name{font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.sticky-price{font-size:20px;font-weight:800;color:var(--green);white-space:nowrap}
.sticky-actions{display:flex;gap:10px;flex-shrink:0}
@media(max-width:768px){.pp-top{grid-template-columns:1fr}.sticky-name{display:none}}
</style>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo"><span class="logo-icon">⚡</span>PricePro</a>
    <div class="nav-actions" style="margin-left:auto;gap:12px">
      <button class="nav-btn theme-toggle" id="theme-toggle">🌙</button>
      <a href="index.html" class="btn-ghost btn-sm">← Search</a>
    </div>
  </div>
</nav>

<div class="product-page-wrap">
  <div class="breadcrumb">
    <a href="index.html">Home</a><span class="breadcrumb-sep">›</span>
    <span id="bc-cat">Category</span><span class="breadcrumb-sep">›</span>
    <span id="bc-name" style="color:var(--text)">Product</span>
  </div>
  <div id="product-content">
    <div style="text-align:center;padding:60px;color:var(--text3)"><div style="font-size:40px;margin-bottom:12px">⏳</div><p>Loading product…</p></div>
  </div>
</div>

<div class="sticky-buy-bar" id="sticky-bar" style="display:none">
  <span class="sticky-name" id="sticky-name"></span>
  <span class="sticky-price" id="sticky-price"></span>
  <div class="sticky-actions">
    <a class="btn-buy" id="sticky-buy" href="#" target="_blank" rel="noopener" style="text-decoration:none;color:#fff;display:inline-flex;align-items:center;justify-content:center">Buy Now →</a>
    <button class="btn-ghost btn-sm" id="sticky-wish">🤍</button>
  </div>
</div>

<footer class="footer" style="margin-top:40px">
  <div class="footer-bottom" style="padding:20px 24px">
    <span>© 2025 PricePro · <a href="index.html" style="color:#94a3b8">Home</a> · <a href="alerts.html" style="color:#94a3b8">Alerts</a></span>
    <span><a href="privacy.html" style="color:#94a3b8">Privacy</a> · <a href="terms.html" style="color:#94a3b8">Terms</a></span>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/images.js"></script>
<script src="js/app.js" defer></script>
<script>
// ── REVIEW DATA (same realistic pool as modal) ───────────────
const REVIEWS_PP = {
  Smartphones:[
    {r:5,name:"Rahul Sharma",city:"Mumbai",text:"Camera in low light is outstanding. Battery lasts a full day with heavy use."},
    {r:5,name:"Priya Mehta",city:"Bangalore",text:"Received in 2 days from Flipkart. No heating issues even during gaming sessions."},
    {r:4,name:"Arjun Kumar",city:"Delhi",text:"Great phone but the box charger is too slow. Bought a 65W charger separately."},
    {r:3,name:"Deepa Reddy",city:"Hyderabad",text:"Decent phone but noticeable heating after 30 minutes of gaming. Expected better."},
    {r:2,name:"Vikash Singh",city:"Chennai",text:"Screen developed a faint line after 6 weeks. Customer support asked me to visit a centre."},
    {r:5,name:"Sunita Patel",city:"Pune",text:"Great display and performance. Only complaint — back is a fingerprint magnet."},
  ],
  Laptops:[
    {r:5,name:"Amit Gupta",city:"Kolkata",text:"Boots in under 15 seconds. Excellent display for long WFH sessions."},
    {r:4,name:"Neha Bose",city:"Ahmedabad",text:"Fan noise minimal on normal tasks. Premium build quality."},
    {r:4,name:"Kiran Joshi",city:"Jaipur",text:"Gets slightly warm under heavy load but keyboard and trackpad feel great."},
    {r:3,name:"Suresh Menon",city:"Lucknow",text:"Screen brightness low for outdoor use. Works fine indoors. Okay value."},
    {r:2,name:"Pooja Lal",city:"Nagpur",text:"Trackpad had clicking issue out of box. Service centre fixed it but frustrating."},
    {r:5,name:"Ravi Chandran",city:"Surat",text:"Handles multiple tabs, coding and video calls without any lag. Highly recommend."},
  ],
  Headphones:[
    {r:5,name:"Anita Das",city:"Indore",text:"ANC completely cuts office noise. Sound quality clear, bass punchy not overwhelming."},
    {r:5,name:"Manoj Nair",city:"Coimbatore",text:"Game changer for commute. Comfortable for 4+ hour sessions."},
    {r:4,name:"Priya Mehta",city:"Bangalore",text:"Great sound but ear cups warm after 2 hours. Minor at this price point."},
    {r:3,name:"Rahul Sharma",city:"Mumbai",text:"ANC not as strong as my old Sony. Comfortable though, decent call quality."},
    {r:2,name:"Kiran Joshi",city:"Jaipur",text:"Left earbud stopped charging after 3 weeks. Replacement under warranty but poor experience."},
    {r:4,name:"Sunita Patel",city:"Pune",text:"Good build quality. Foldable design convenient. Battery as advertised."},
  ],
  Sneakers:[
    {r:5,name:"Arjun Kumar",city:"Delhi",text:"Super comfortable from day one. Wore for 8km walk — zero discomfort."},
    {r:5,name:"Neha Bose",city:"Ahmedabad",text:"Looks exactly as shown. Great cushioning. Delivered in 2 days."},
    {r:4,name:"Vikash Singh",city:"Chennai",text:"Good quality but runs slightly narrow. Size up if you have wide feet."},
    {r:3,name:"Deepa Reddy",city:"Hyderabad",text:"Sole grip great but upper stitching started coming loose after 3 months."},
    {r:2,name:"Pooja Lal",city:"Nagpur",text:"Colour faded significantly after 4-5 washes. Not expected at this price."},
    {r:5,name:"Amit Gupta",city:"Kolkata",text:"Bought without trying — sizing was perfect using the guide. Very happy."},
  ],
  Clothing:[
    {r:5,name:"Sunita Patel",city:"Pune",text:"Fabric quality good. Colours haven't faded after 6 washes. Will buy again."},
    {r:4,name:"Manoj Nair",city:"Coimbatore",text:"Nice fit, true to size. Good stitching. Delivery well-packaged."},
    {r:3,name:"Anita Das",city:"Indore",text:"Material a bit thin for the price. Fine for summer but not for AC environments."},
    {r:2,name:"Ravi Chandran",city:"Surat",text:"Received defective piece with uneven hem. Return process smooth but wait was long."},
    {r:4,name:"Priya Mehta",city:"Bangalore",text:"Ordered 3 pieces. All exactly as described. Washed multiple times — quality holds."},
    {r:5,name:"Kiran Joshi",city:"Jaipur",text:"Value for money. Fabric doesn't pill after washing. Satisfied."},
  ],
  default:[
    {r:5,name:"Rahul Sharma",city:"Mumbai",text:"Excellent product. Exactly as described. Fast delivery, great packaging."},
    {r:4,name:"Priya Mehta",city:"Bangalore",text:"Good quality for the price. Minor issues but overall very satisfied."},
    {r:4,name:"Arjun Kumar",city:"Delhi",text:"Works exactly as expected. No complaints after 2 months of daily use."},
    {r:3,name:"Deepa Reddy",city:"Hyderabad",text:"Decent product. Meets basic needs. Nothing extraordinary but no major issues."},
    {r:2,name:"Vikash Singh",city:"Chennai",text:"Quality not as shown in images. Looks cheaper in person. Slightly disappointed."},
    {r:5,name:"Sunita Patel",city:"Pune",text:"After much research this was the best deal. Very happy with the decision."},
  ]
};

function getRatings(p){ return (REVIEWS_PP[p.category]||REVIEWS_PP.default).map((r,i)=>({...r,date:["Yesterday","2 days ago","5 days ago","1 week ago","2 weeks ago","1 month ago"][(p.id+i*3)%6],store:p.stores[i%p.stores.length].name})); }

function fmt(n){ return "₹"+n.toLocaleString("en-IN"); }
function stars(r){ return "★".repeat(Math.floor(r))+"☆".repeat(5-Math.floor(r)); }

function getAvail(p,i){const s=(p.id*7+i*3)%10;if(p.discount>=70&&s<4)return`<span style="color:var(--orange);font-weight:600">⚡ Only 3 left</span>`;if(p.discount>=50&&s<2)return`<span style="color:var(--orange);font-weight:600">⚡ Limited Stock</span>`;if(s===9)return`<span style="color:var(--text3)">Check Store</span>`;return`<span style="color:var(--green)">✓ In Stock</span>`;}

// ── MAIN RENDER ───────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  const s = localStorage.getItem("pp_theme")||"light";
  document.documentElement.setAttribute("data-theme",s);
  document.getElementById("theme-toggle").textContent=s==="dark"?"☀️":"🌙";
  document.getElementById("theme-toggle").addEventListener("click",()=>{const c=document.documentElement.getAttribute("data-theme"),n=c==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);localStorage.setItem("pp_theme",n);document.getElementById("theme-toggle").textContent=n==="dark"?"☀️":"🌙";});
  window.addEventListener("scroll",()=>{document.getElementById("navbar").style.boxShadow=window.scrollY>10?"0 2px 12px rgba(0,0,0,.08)":"none";});

  const id = parseInt(new URLSearchParams(window.location.search).get("id"));
  if (!id || isNaN(id)) { showError(); return; }
  const p = PRODUCTS.find(x => x.id===id);
  if (!p) { showError(); return; }
  renderProduct(p);
});

function renderProduct(p){
  document.getElementById("page-title").textContent=`${p.name} — Best Price ${fmt(p.bestPrice)} · PricePro`;
  document.getElementById("page-desc").content=`Compare prices for ${p.name}. Best: ${fmt(p.bestPrice)} at ${p.bestStore}. Save ${p.discount}%.`;
  document.getElementById("bc-cat").textContent=p.category;
  document.getElementById("bc-name").textContent=p.name;

  // Track recently viewed
  try{let rv=JSON.parse(localStorage.getItem("pp_recent")||"[]");rv=[p.id,...rv.filter(x=>x!==p.id)].slice(0,8);localStorage.setItem("pp_recent",JSON.stringify(rv));}catch(e){}

  const wl=JSON.parse(localStorage.getItem("pp_wishlist")||"[]");
  const inWish=wl.includes(p.id);
  const months=["Jan","Feb","Mar","Apr","May","Jun"];
  const maxH=Math.max(...p.history);
  const bars=p.history.map((v,i)=>`<div class="chart-bar-item" style="height:${Math.round((v/maxH)*100)}%;background:${v===p.bestPrice?"#16a34a":"#bfdbfe"}" data-tip="${months[i]}: ${fmt(v)}"></div>`).join("");
  const reviews=getRatings(p);
  const related=PRODUCTS.filter(r=>r.category===p.category&&r.id!==p.id).sort((a,b)=>b.discount-a.discount).slice(0,6);

  document.getElementById("product-content").innerHTML=`
    <div class="pp-top">
      <div class="pp-img">${getProductImageHTML(p,"detail")}</div>
      <div class="pp-info">
        <div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">${p.category}</div>
        <h1>${p.name}</h1>
        <div class="pp-rating">
          <span style="color:#f59e0b">${stars(p.rating)}</span>
          <strong>${p.rating}</strong>
          <span style="color:var(--text3)">(${p.reviews.toLocaleString()} reviews)</span>
          ${p.hot?`<span style="background:#fee2e2;color:#dc2626;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px">🔥 HOT</span>`:""}
        </div>
        <div><span class="price-hero">${fmt(p.bestPrice)}</span><span class="price-orig-tag">${fmt(p.originalPrice)}</span></div>
        <div class="save-tag">🎉 Save ${fmt(p.originalPrice-p.bestPrice)} (${p.discount}% off MRP)</div>
        <div class="action-row">
          <a class="btn-buy" href="${p.stores[0].url}" target="_blank" rel="noopener"
             style="text-decoration:none;color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:12px 28px;font-size:15px">
             Buy on ${p.bestStore} →
          </a>
          <button class="btn-ghost" id="wish-btn" onclick="toggleWish(${p.id})">${inWish?"❤️ Wishlisted":"🤍 Wishlist"}</button>
          <button class="btn-ghost btn-sm" onclick="shareProduct(${p.id})">🔗 Share</button>
        </div>
        <div class="price-disclaimer">🔗 Buy links open store search pages. Always verify the final price at checkout before purchasing.</div>
        <div class="spec-pills">${Object.entries(p.specs||{}).slice(0,6).map(([k,v])=>`<span class="spec-pill"><strong>${k}:</strong> ${v}</span>`).join("")}</div>
        <div class="live-tag"><span class="live-dot"></span>Prices tracked ${Math.floor(Math.random()*45)+5} minutes ago</div>
      </div>
    </div>

    <div class="sec-card">
      <h2>🏪 Price Comparison Across Stores</h2>
      <table class="price-table">
        <thead><tr><th>Store</th><th>Price</th><th>You Save</th><th>Availability</th><th>Action</th></tr></thead>
        <tbody>${p.stores.map((s,i)=>`
          <tr class="${i===0?"best-row":""}">
            <td><strong>${s.name}</strong>${i===0?` <span style="background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;margin-left:6px">BEST</span>`:""}</td>
            <td class="store-price">${fmt(s.price)}</td>
            <td style="color:${s.price<p.originalPrice?"var(--green)":"var(--text3)"}">${s.price<p.originalPrice?`−${fmt(p.originalPrice-s.price)}`:"—"}</td>
            <td style="font-size:13px">${getAvail(p,i)}</td>
            <td><a class="visit-link" href="${s.url}" target="_blank" rel="noopener">Visit →</a></td>
          </tr>`).join("")}
        </tbody>
      </table>
      <div class="price-disclaimer" style="margin-top:10px">⚠️ Links open store search pages. Prices may differ. Confirm price at checkout before purchase.</div>
    </div>

    <div class="sec-card">
      <h2>📈 6-Month Price History</h2>
      <div class="chart-wrap">${bars}</div>
      <div class="chart-months">${months.map(m=>`<span class="chart-month">${m}</span>`).join("")}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;text-align:center">
        <div style="background:var(--bg2);border-radius:8px;padding:10px"><div style="font-weight:800;color:var(--green)">${fmt(Math.min(...p.history))}</div><div style="font-size:11px;color:var(--text3)">Lowest Ever</div></div>
        <div style="background:var(--bg2);border-radius:8px;padding:10px"><div style="font-weight:800">${fmt(Math.round(p.history.reduce((a,b)=>a+b,0)/p.history.length))}</div><div style="font-size:11px;color:var(--text3)">6-Month Avg</div></div>
        <div style="background:var(--bg2);border-radius:8px;padding:10px"><div style="font-weight:800;color:var(--red)">${fmt(Math.max(...p.history))}</div><div style="font-size:11px;color:var(--text3)">Highest</div></div>
      </div>
    </div>

    <div class="sec-card">${renderEMICalculator ? renderEMICalculator(p.bestPrice) : ""}</div>
    ${p.specs?`<div class="sec-card"><h2>📋 Full Specifications</h2><table class="specs-table">${Object.entries(p.specs).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table></div>`:""}

    <div class="sec-card">
      <h2>⭐ Customer Reviews</h2>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:20px">
        <div style="text-align:center;background:var(--bg2);border-radius:12px;padding:16px 20px">
          <div style="font-size:44px;font-weight:800;line-height:1">${p.rating}</div>
          <div style="color:#f59e0b;font-size:16px;margin:4px 0">${stars(p.rating)}</div>
          <div style="font-size:11px;color:var(--text3)">${p.reviews.toLocaleString()} ratings</div>
        </div>
        <div>${[5,4,3,2,1].map(n=>{const pct=n===5?58:n===4?24:n===3?10:n===2?5:3;return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><span style="font-size:12px;color:var(--text3);width:20px;text-align:right">${n}★</span><div style="flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden"><div style="width:${pct}%;height:100%;background:#f59e0b;border-radius:4px"></div></div><span style="font-size:11px;color:var(--text3);width:28px">${pct}%</span></div>`;}).join("")}</div>
      </div>
      ${reviews.map(r=>`<div class="rev-item">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <div style="display:flex;align-items:center;gap:10px">
            <div class="rev-avatar">${r.name.charAt(0)}</div>
            <div>
              <div style="font-size:13px;font-weight:600">${r.name} <span style="color:var(--text3);font-weight:400">· ${r.city}</span></div>
              <div style="font-size:11px;color:var(--text3)">${r.date}</div>
            </div>
          </div>
        </div>
        <div class="star-${r.r}" style="font-size:13px;margin-bottom:5px">${"★".repeat(r.r)}${"☆".repeat(5-r.r)} <span style="color:var(--text3);font-size:12px">${["","","Poor","Average","Good","Excellent"][r.r]}</span></div>
        <div style="font-size:13px;color:var(--text2);line-height:1.65">${r.text}</div>
        <div style="font-size:11px;color:var(--green);margin-top:6px">✓ Verified Purchase via ${r.store}</div>
      </div>`).join("")}
    </div>

    <div class="sec-card">
      <h2>🔗 Share This Deal</h2>
      <div class="share-row">
        <button class="share-btn-sm" onclick="shareWA(${p.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="#25d366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>WhatsApp</button>
        <button class="share-btn-sm" onclick="shareTwitter(${p.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Twitter / X</button>
        <button class="share-btn-sm" onclick="copyLink(${p.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Copy Link</button>
        <a class="share-btn-sm" href="alerts.html" style="text-decoration:none">🔔 Set Price Alert</a>
      </div>
    </div>

    <div class="sec-card">
      <h2>🛍️ Similar Products</h2>
      <div class="related-grid">
        ${related.map(r=>`<a class="related-card" href="product.html?id=${r.id}"><div class="related-img">${getProductImageHTML(r,"card")}</div><div class="related-info"><div class="related-name">${r.name}</div><span class="related-price">${fmt(r.bestPrice)}</span><span class="related-disc">${r.discount}% off</span></div></a>`).join("")}
      </div>
    </div>`;

  // Inject JSON-LD schema for SEO
  if (window.addProductSchema) addProductSchema(p);

  // Sticky bar
  document.getElementById("sticky-bar").style.display="flex";
  document.getElementById("sticky-name").textContent=p.name;
  document.getElementById("sticky-price").textContent=fmt(p.bestPrice);
  document.getElementById("sticky-buy").href=p.stores[0].url;
  const sw=document.getElementById("sticky-wish");
  sw.textContent=inWish?"❤️":"🤍"; sw.onclick=()=>toggleWish(p.id);
}

function toggleWish(id){
  let wl=JSON.parse(localStorage.getItem("pp_wishlist")||"[]");
  const idx=wl.indexOf(id);
  if(idx===-1){wl.push(id);showToast("❤️ Added to wishlist");}else{wl.splice(idx,1);showToast("Removed from wishlist");}
  localStorage.setItem("pp_wishlist",JSON.stringify(wl));
  const inWish=wl.includes(id);
  const btn=document.getElementById("wish-btn"); if(btn)btn.textContent=inWish?"❤️ Wishlisted":"🤍 Wishlist";
  const sw=document.getElementById("sticky-wish"); if(sw){sw.textContent=inWish?"❤️":"🤍";sw.onclick=()=>toggleWish(id);}
}

function getProductUrl(id){return`${window.location.origin}${window.location.pathname.split("/product.html")[0]}/product.html?id=${id}`;}
function shareWA(id){const p=PRODUCTS.find(x=>x.id===id);if(!p)return;window.open(`https://wa.me/?text=${encodeURIComponent(`🔥 ${p.name} at just ${fmt(p.bestPrice)}! Save ${p.discount}% — ${getProductUrl(id)}`)}`,"_blank");}
function shareTwitter(id){const p=PRODUCTS.find(x=>x.id===id);if(!p)return;window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(`🔥 ${p.name} at ${fmt(p.bestPrice)}! ${p.discount}% off`)}&url=${encodeURIComponent(getProductUrl(id))}`,"_blank");}
function copyLink(id){navigator.clipboard?.writeText(getProductUrl(id)).then(()=>showToast("✅ Link copied!")).catch(()=>showToast("Copy: "+getProductUrl(id)));}
function shareProduct(id){shareWA(id);}
function showToast(msg){document.querySelector(".pp-toast")?.remove();const t=document.createElement("div");t.className="pp-toast";t.style.cssText="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 22px;border-radius:8px;font-size:14px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.25);white-space:nowrap";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
// ── LOCAL FALLBACKS if app.js not loaded ─────────────────────
if (typeof getBestTimeToBuy === "undefined") {
  function getBestTimeToBuy(p) {
    if (!p.history || p.history.length < 2) return "";
    const mn = Math.min(...p.history), avg = p.history.reduce((a,b)=>a+b,0)/p.history.length;
    const curr = p.bestPrice;
    if (curr <= mn * 1.02) return `<div class="buy-verdict verdict-buy"><span class="verdict-icon">🟢</span><div><div class="verdict-title">Best time to buy!</div><div class="verdict-desc">Lowest recorded price. Unlikely to drop further.</div></div></div>`;
    if (curr < avg * 0.95) return `<div class="buy-verdict verdict-ok"><span class="verdict-icon">🟡</span><div><div class="verdict-title">Good deal — buy now</div><div class="verdict-desc">Price is ${Math.round(((avg-curr)/avg)*100)}% below 6-month average of ${fmt(Math.round(avg))}.</div></div></div>`;
    return `<div class="buy-verdict verdict-wait"><span class="verdict-icon">🔴</span><div><div class="verdict-title">Consider waiting</div><div class="verdict-desc">Price is above the lowest recorded ${fmt(mn)}. May drop again.</div></div></div>`;
  }
}
if (typeof renderEMICalculator === "undefined") {
  function renderEMICalculator(price) {
    return `<h4 style="font-size:15px;font-weight:700;margin-bottom:16px">💳 EMI Calculator</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div><label style="display:block;font-size:12px;color:var(--text3);margin-bottom:5px">Loan Amount (₹)</label>
        <input type="number" id="emi-amount" value="${price}" min="1000" step="500" oninput="calcEMI()" style="width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);outline:none"/></div>
      <div><label style="display:block;font-size:12px;color:var(--text3);margin-bottom:5px">Interest Rate (% p.a.)</label>
        <input type="number" id="emi-rate" value="14" min="0" max="36" step="0.5" oninput="calcEMI()" style="width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);outline:none"/></div>
      <div><label style="display:block;font-size:12px;color:var(--text3);margin-bottom:5px">Tenure</label>
        <select id="emi-months" onchange="calcEMI()" style="width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);outline:none">
          <option value="3">3 months</option><option value="6" selected>6 months</option>
          <option value="9">9 months</option><option value="12">12 months</option>
          <option value="18">18 months</option><option value="24">24 months</option>
        </select></div>
      <div><label style="display:block;font-size:12px;color:var(--text3);margin-bottom:5px">Down Payment (₹)</label>
        <input type="number" id="emi-down" value="0" min="0" step="500" oninput="calcEMI()" style="width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);outline:none"/></div>
    </div>
    <div id="emi-result" style="background:var(--accent);border-radius:8px;padding:16px;text-align:center;color:#fff">
      <div id="emi-monthly" style="font-size:28px;font-weight:800;line-height:1">—</div>
      <div style="font-size:12px;opacity:.8;margin-top:4px">Monthly EMI</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px">
        <div style="background:rgba(255,255,255,.15);border-radius:6px;padding:8px"><div id="emi-total" style="font-size:13px;font-weight:700">—</div><div style="font-size:10px;opacity:.7">Total</div></div>
        <div style="background:rgba(255,255,255,.15);border-radius:6px;padding:8px"><div id="emi-interest" style="font-size:13px;font-weight:700">—</div><div style="font-size:10px;opacity:.7">Interest</div></div>
        <div style="background:rgba(255,255,255,.15);border-radius:6px;padding:8px"><div id="emi-per-day" style="font-size:13px;font-weight:700">—</div><div style="font-size:10px;opacity:.7">Per Day</div></div>
      </div>
    </div>
    <p style="font-size:11px;color:var(--text3);margin-top:8px">* Indicative only. Check with your bank before purchase.</p>`;
  }
  function calcEMI() {
    const P=parseFloat(document.getElementById("emi-amount")?.value)||0;
    const down=parseFloat(document.getElementById("emi-down")?.value)||0;
    const r=parseFloat(document.getElementById("emi-rate")?.value)||0;
    const n=parseInt(document.getElementById("emi-months")?.value)||6;
    const principal=Math.max(0,P-down); if(!principal)return;
    let emi,total;
    if(r===0){emi=principal/n;total=principal;}
    else{const mr=(r/12)/100;emi=principal*mr*Math.pow(1+mr,n)/(Math.pow(1+mr,n)-1);total=emi*n;}
    const interest=total-principal,perday=(total+down)/(n*30);
    document.getElementById("emi-monthly").textContent=fmt(Math.round(emi));
    document.getElementById("emi-total").textContent=fmt(Math.round(total+down));
    document.getElementById("emi-interest").textContent=fmt(Math.round(interest));
    document.getElementById("emi-per-day").textContent=fmt(Math.round(perday));
  }
}

function showError(){document.getElementById("product-content").innerHTML=`<div style="text-align:center;padding:60px 20px"><div style="font-size:60px;margin-bottom:16px">😕</div><h2 style="margin-bottom:8px">Product Not Found</h2><p style="color:var(--text2);margin-bottom:24px">This product may have been removed or the link is incorrect.</p><a href="index.html" class="btn-primary" style="text-decoration:none;display:inline-flex;align-items:center">← Back to Home</a></div>`;}
</script>
</body>
</html>
